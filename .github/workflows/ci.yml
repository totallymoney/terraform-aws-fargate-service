name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  TERRAFORM_VERSION: 1.16.2

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive

      - name: Validate
        run: |
          set -e
          for dir in $(find . -name '*.tf' -not -path './.git/*' -exec dirname {} \; | sort -u); do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # Mocked providers, so this needs no AWS account and no credentials.
      - name: Test
        run: |
          terraform init -backend=false -input=false
          terraform test

  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Blocking. Findings that are accepted by design are listed with a
      # reason in .trivyignore, so a failure here means something new.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore
          exit-code: '1'
